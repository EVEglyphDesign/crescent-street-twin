  <style>@font-face{font-family:Inter;src:url('Inter.ttf') format('truetype');} text{font-family:Inter,Arial,sans-serif;font-weight:600;letter-spacing:-1.6px;}</style>
  <text x="40" y="93" font-size="62" fill="#ffffff">The Crescent</text>
  <text x="40" y="182" font-size="78" fill="#ffffff">Street</text>
  <text x="279" y="182" font-size="78" fill="#e87722">Twin</text>
