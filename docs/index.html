<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Crescent Street Twin — EVEglyphDesign</title>
<meta name="description" content="A consent-first digital twin of Rue Crescent, Montréal. Wireframe with demo data. EVEglyphDesign.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="appheader">
  <span class="wordmark">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-label="EVEglyphDesign mark" role="img">
      <rect x="2.5" y="2.5" width="19" height="19" rx="4" stroke="#e87722" stroke-width="2"></rect>
      <path d="M7.5 12h9M7.5 8h9M7.5 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="square"></path>
    </svg>
    EVEglyphDesign
  </span>
  <span class="hdr-right">
    <span class="livedot" title="Live"><i></i>LIVE</span>
    <span class="langtoggle">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
    </span>
    <button type="button" class="menubtn" id="menubtn" aria-label="More screens" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="#e87722" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
  </span>
  <span class="chip-wf" data-en="Wireframe — demo data" data-fr="Maquette — données de démo">Wireframe — demo data</span>
</header>

<main id="app"></main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="More screens">
  <div class="sheet-inner" id="sheet-inner"></div>
</div>

<nav id="tabbar" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
